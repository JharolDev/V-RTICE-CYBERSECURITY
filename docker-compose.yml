services:

  frontend:
    build:
      context: ./frontend
    container_name: colombia-intelligence-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: colombia-intelligence-backend
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: colombia_intelligence
      POSTGRES_USER: colombia
      POSTGRES_PASSWORD: colombia_dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:17
    container_name: colombia-intelligence-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: colombia_intelligence
      POSTGRES_USER: colombia
      POSTGRES_PASSWORD: colombia_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: colombia-intelligence-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
